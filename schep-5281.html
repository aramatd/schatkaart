<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schep</title>

<!-- Minecraft lettertype via CDN -->
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
  /* Groene achtergrond rondom de schep */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #598e53;
    overflow: hidden;
  }

 #background-container {
    width: 90%;
    max-width: 500px;
    text-align: center;
  }

  /* Tekst boven de boot */
  #boot-text {
    font-family: 'Minecraftia', sans-serif;
    color: white;
    font-size: 20px;
    margin-bottom: 10px;
  }

  /* Wrapper voor correcte positionering */
  #boot-wrapper {
    position: relative;
  }

  #boot {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Klein papier (Minecraft-stijl) */
  #paper {
    position: absolute;
    top: 20%;
    left: 75%;
    transform: translate(-50%, -50%) scale(0.1) rotate(-15deg); /* diagonaal */
    width: 70px;   /* klein zoals in Minecraft */
    height: auto;
    cursor: pointer;
    opacity: 0;
    transition: transform 3s ease, opacity 0.5s ease;
    pointer-events: none; /* niet klikbaar */
  }

  #paper.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-15deg);
    pointer-events: auto; /* wél klikbaar zodra zichtbaar */
  }

  /* Groot papier overlay */
  #full-paper {
    position: fixed;
    top: 5%;
    left: 5%;
    width: 90%;
    max-height: 90%;
    background-color: #ffffff;
    border: 4px solid #000;
    border-radius: 2px;
    box-shadow: 
      inset -2px -2px 0 #e0dfd0,
      inset 2px 2px 0 #e0dfd0,
      5px 5px 0 #000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    font-family: 'Minecraftia', sans-serif;
    font-size: 1.5rem;
    text-align: center;
    overflow-y: auto;
  }

  #full-paper img {
  max-width: 100%;
  max-height: 100%;
  height: auto;
  display: block;
}

  /* Responsive tekst voor kleine schermen */
  @media (max-width: 600px) {
    #full-paper {
      font-size: 1.2rem;
    }
  }
</style>
</head>
<body>
<div id="background-container">

  <div id="boot-text">Wauw! Een gouden schep! Daarmee kun je je schat supersnel opgraven!<br>
  <br>
  O! Zit er een briefje op geplakt?<br>
  <br></div>

  <div id="boot-wrapper">
    <img id="boot" src="goudenschep.png" alt="Boot">
    <img id="paper" src="paper-.png" alt="Minecraft Papier">
  </div>

</div>


<div id="full-paper">
  <img src="breuken.png" alt="Opdracht">
</div>


<script>
  // Klein papier verschijnt na 5 seconden
  setTimeout(() => {
    document.getElementById('paper').classList.add('show');
  }, 5000);

  // Klik op klein papier → groot papier tonen
  document.getElementById('paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'flex';
  });

  // Klik op groot papier → sluiten
  document.getElementById('full-paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'none';
  });
</script>

</body>
</html>
