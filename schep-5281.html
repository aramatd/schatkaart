<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schep</title>

<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #598e53;
    overflow: hidden;
  }

  #background-container {
    position: relative;
    width: 90%;
    max-width: 500px;
  }

  #boot {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Klein papier */
  #paper {
    position: absolute;
    top: 20%;
    left: 75%;
    transform: translate(-50%, -50%) scale(0.1) rotate(-15deg);
    width: 70px;
    height: auto;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: transform 3s ease, opacity 0.5s ease;
  }

  #paper.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-15deg);
    pointer-events: auto;
  }

  /* Groot papier */
  #full-paper {
    position: fixed;
    top: 5%;
    left: 5%;
    width: 90%;
    max-height: 90%;
    background-color: #fffdf5;
    border: 4px solid #000;
    border-radius: 2px;
    box-shadow: 
      inset -2px -2px 0 #e0dfd0,
      inset 2px 2px 0 #e0dfd0,
      5px 5px 0 #000;

    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    overflow: hidden;

    transform: scale(0.2);
    opacity: 0;
    transition: transform 0.4s ease, opacity 0.3s ease;
  }

  #full-paper.show {
    transform: scale(1);
    opacity: 1;
  }

  /* Afbeelding binnen groot papier */
  #full-paper img {
    max-width: 100%;
    max-height: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

<div id="background-container">
  <img id="boot" src="goudenschep.png" alt="Boot">
  <img id="paper" src="paper-.png" alt="Minecraft Papier">
</div>

<div id="full-paper">
  <img src="jouw_afbeelding.png" alt="Opdracht">
</div>

<script>
  // Klein papier verschijnt na 5 seconden
  setTimeout(() => {
    document.getElementById('paper').classList.add('show');
  }, 5000);

  // Klik op klein papier → groot papier tonen
  document.getElementById('paper').addEventListener('click', () => {
    const paper = document.getElementById('full-paper');
    paper.style.display = 'flex';

    setTimeout(() => {
      paper.classList.add('show');
    }, 10);
  });

  // Klik op groot papier → sluiten
  document.getElementById('full-paper').addEventListener('click', () => {
    const paper = document.getElementById('full-paper');
    paper.classList.remove('show');

    setTimeout(() => {
      paper.style.display = 'none';
    }, 400);
  });
</script>

</body>
</html>
