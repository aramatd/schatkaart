<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schatkaart met Minecraft Papier</title>

<!-- Minecraft lettertype via CDN -->
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
  /* Minecraft-blauwe achtergrond rondom de boot */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #3b82f6; /* Minecraft blauw */
    overflow: hidden;
  }

  /* Container met boot in het midden */
  #background-container {
    position: relative;
    width: 90%;
    max-width: 500px;
  }

  #boot {
    width: 100%;
    height: auto;
    display: block;
  }

#paper {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.1) rotate(-15deg);
  width: 40px;   /* veel kleiner */
  height: 50px;  /* pixelverhouding zoals in Minecraft */
  background-color: #ffffff;

  /* pixelige zwarte rand */
  border: 1px solid #000;
  box-shadow:
    1px 1px 0 #000,
    -1px 1px 0 #000,
    1px -1px 0 #000,
    -1px -1px 0 #000;

  /* lichte vlekjes zoals in Minecraft */
  background-image:
    linear-gradient(90deg, rgba(240,240,240,0.5) 10%, transparent 10%),
    linear-gradient(rgba(240,240,240,0.5) 10%, transparent 10%);
  background-size: 5px 5px;

  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Minecraftia', sans-serif;
  font-size: 0.7rem;
  opacity: 0;
  transition: transform 3s ease, opacity 0.5s ease;
}

#paper.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1) rotate(-15deg);
}
  /* Groot papier overlay */
  #full-paper {
    position: fixed;
    top: 5%;
    left: 5%;
    width: 90%;
    max-height: 90%;
    background-color: #fffdf5;
    border: 4px solid #000;
    border-radius: 2px;
    box-shadow: 
      inset -2px -2px 0 #e0dfd0,
      inset 2px 2px 0 #e0dfd0,
      5px 5px 0 #000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    font-family: 'Minecraftia', sans-serif;
    font-size: 1.5rem;
    text-align: center;
    overflow-y: auto;
  }

  /* Responsive tekst voor kleine schermen */
  @media (max-width: 600px) {
    #paper {
      font-size: 0.9rem;
    }
    #full-paper {
      font-size: 1.2rem;
    }
  }
</style>
</head>
<body>

<div id="background-container">
  <img id="boot" src="boot_groot.png" alt="Boot">
  <div id="paper">Klik hier</div>
</div>

<div id="full-paper">
  Hier staat de tekst op het papier. Je kunt hier meer tekst plaatsen.
</div>

<script>
  // Papier verschijnt na 5 seconden
  setTimeout(() => {
    document.getElementById('paper').classList.add('show');
  }, 5000);

  // Klik op klein papier → groot papier tonen
  document.getElementById('paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'flex';
  });

  // Klik op groot papier → sluiten
  document.getElementById('full-paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'none';
  });
</script>

</body>
</html>
