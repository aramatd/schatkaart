<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Papier Overlay</title>

<!-- Minecraft lettertype via CDN -->
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: url('schatkaart/boot_groot.png') no-repeat center center;
    background-size: cover;
    overflow: hidden;
  }

  /* Kleine “papier” rechthoek in het midden */
  #paper {
    position: absolute;
    width: 50px;  /* startgrootte klein */
    height: 50px;
    background-color: white;
    border: 2px solid black;
    box-sizing: border-box;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 10px;
    font-family: 'Minecraftia', sans-serif;
    font-size: 1rem;
    opacity: 0;
    transform: scale(0.1);
    transition: transform 3s ease, opacity 0.5s ease;
  }

  #paper.show {
    opacity: 1;
    transform: scale(1);
  }

  /* Groot papier overlay */
  #full-paper {
    position: fixed;
    top: 5%;
    left: 5%;
    width: 90%;
    height: 90%;
    background-color: white;
    border: 4px solid black;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    font-family: 'Minecraftia', sans-serif;
    font-size: 1.5rem;
    text-align: center;
    overflow: auto;
  }
</style>
</head>
<body>

<div id="paper">Klik!</div>
<div id="full-paper">
  Hier staat de tekst op het papier. Je kunt hier meer tekst plaatsen.
</div>

<script>
  // Laat het papier verschijnen na 5 seconden
  setTimeout(() => {
    const paper = document.getElementById('paper');
    paper.classList.add('show');
  }, 5000);

  // Klik op klein papier → laat groot papier zien
  document.getElementById('paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'flex';
  });

  // Klik op groot papier → sluit het
  document.getElementById('full-paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'none';
  });
</script>

</body>
</html>
