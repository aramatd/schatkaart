<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boot</title>

<!-- Minecraft lettertype via CDN -->
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
  /* Minecraft-blauwe achtergrond rondom de boot */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #3b82f6; /* Minecraft blauw */
    overflow: hidden;
  }

  /* Container met boot in het midden */
  #background-container {
    position: relative;
    width: 90%;
    max-width: 500px;
  }

  #boot {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Klein papier (Minecraft-stijl) */
  #paper {
    position: absolute;
    top: 43%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.1) rotate(-15deg); /* diagonaal */
    width: 70px;   /* klein zoals in Minecraft */
    height: auto;
    cursor: pointer;
    opacity: 0;
    transition: transform 3s ease, opacity 0.5s ease;
  }

  #paper.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-15deg);
  }

  /* Groot papier overlay */
  #full-paper {
    position: fixed;
    top: 5%;
    left: 5%;
    width: 90%;
    max-height: 90%;
    background-color: #fffdf5;
    border: 4px solid #000;
    border-radius: 2px;
    box-shadow: 
      inset -2px -2px 0 #e0dfd0,
      inset 2px 2px 0 #e0dfd0,
      5px 5px 0 #000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    font-family: 'Minecraftia', sans-serif;
    font-size: 1.5rem;
    text-align: center;
    overflow-y: auto;
  }

  /* Responsive tekst voor kleine schermen */
  @media (max-width: 600px) {
    #full-paper {
      font-size: 1.2rem;
    }
  }
</style>
</head>
<body>

<div id="background-container">
  <img id="boot" src="boot_groot.png" alt="Boot">
  <img id="paper" src="paper-.png" alt="Minecraft Papier">
</div>

<div id="full-paper">
  Horizontaal:<br>
1. 78 - 27<br>
2. 158 x 4<br>
5. 640 : 8<br>
6. 331 + 55<br>
8. 102 : 2<br>
9. 784 - 67<br>
10. 290 + 93<br>
13. 7 x 9<br>
<br>
Verticaal:<br>
3. 88 - 55<br>
4. 125 : 5<br>
7. 141 + 412<br>
11. 156 - 62<br>
12. 134 : 2<br>
14. 29 + 54<br>
15. 47 + 45<br>
</div>

<script>
  // Klein papier verschijnt na 5 seconden
  setTimeout(() => {
    document.getElementById('paper').classList.add('show');
  }, 10000);

  // Klik op klein papier → groot papier tonen
  document.getElementById('paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'flex';
  });

  // Klik op groot papier → sluiten
  document.getElementById('full-paper').addEventListener('click', () => {
    document.getElementById('full-paper').style.display = 'none';
  });
</script>

</body>
</html>
